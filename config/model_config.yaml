# ============================================================
# 模型超参数配置
# 依据：《AI焦化厂智能化落地方案 V1.1》4.1.3 / 4.2.3 / 4.3.2 / 4.4.1 / 5.1
# ============================================================

# ------------------------------------------------------------
# 模型A（冷启动）：经验配煤模型
# CBRI法 / 新日铁配煤法 / 鞍山热能院煤岩配煤模型（公开文献）
# 参数为占位初值，投产前用 40kg/200kg 试验焦炉 DOE 数据标定（见4.1.6）
# ------------------------------------------------------------
empirical_blending:
  methods: ["cbri", "nippon_steel", "coal_petrographic"]  # 三法结果对照取交集
  # CBRI法占位参数（以文献公开公式为准，TODO: DOE数据标定后回填）
  cbri:
    coal_blend_strength_index: 10.0    # 配合煤强度指数占位
    coal_rank_index: 100.0             # 煤阶指数占位
    csr_offset: 0.0                    # 小焦炉→大炉 CSR 系统偏差修正（4.1.6要求标定）
    cri_offset: 0.0                    # 小焦炉→大炉 CRI 系统偏差修正
  # 煤岩配煤模型占位参数（鞍山热能院法）
  coal_petrographic:
    active_inert_ratio_optimal: 1.6    # 最优活惰比占位（文献区间1.4~1.8）
    rmax_distribution_target:          # 镜质组反射率分布目标占比（分段）
      "0.6-0.7": 0.05
      "0.7-0.9": 0.15
      "0.9-1.2": 0.40
      "1.2-1.5": 0.30
      "1.5-2.0": 0.10
    notch_penalty: 5.0                 # 分布"凹口"惩罚权重（V1.1：混配凹口是配煤大忌）

# ------------------------------------------------------------
# 模型A（数据积累后）：焦炭质量预测 LightGBM
# 目标：M25 / M10 / CSR / CRI 多输出；支持增量学习热启动（见4.1.7）
# ------------------------------------------------------------
lightgbm_quality:
  objective: "regression"
  boosting_type: "gbdt"
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 800
  max_depth: -1
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42
  # 增量学习（4.1.7）
  incremental:
    enabled: true
    error_threshold: 2.0               # 单点预测误差超过该值进缓冲（对应10.1 KPI容差）
    buffer_size: 50                    # 缓冲区满50条触发微调
    fine_tune_learning_rate: 0.01      # 小学习率防遗忘
    fine_tune_n_estimators: 100
  # 特征与目标列由 data/pipeline/feature_store.py 的特征分组常量提供
  targets: ["m25", "m10", "csr", "cri"]

# ------------------------------------------------------------
# 火道温度预测 LSTM（4.2.3：时序依赖强；配合MPC做30min前瞻）
# ------------------------------------------------------------
lstm_furnace:
  input_window_minutes: 60             # 过去60min输入（见4.2.4步骤1）
  output_horizon_minutes: 30           # 预估未来30min温度曲线
  resample_interval_seconds: 60        # 序列重采样到1min粒度
  features:                            # 对齐4.2.5采集清单
    - "fire_channel_temp_machine"
    - "fire_channel_temp_coke"
    - "gas_flow_machine"
    - "gas_flow_coke"
    - "flue_suction_machine"
    - "flue_suction_coke"
    - "oxygen_content"
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  bidirectional: false
  training:
    batch_size: 64
    epochs: 200
    learning_rate: 0.001
    early_stopping_patience: 20
    optimizer: "adam"
    loss: "mse"
    retrain_frequency: "daily"         # 5.1：训练频率每日

# ------------------------------------------------------------
# 配煤成本优化 遗传算法（scikit-opt，4.1.3）
# 适应度函数调用质量预测模型作为"模拟器"
# ------------------------------------------------------------
genetic_algorithm:
  pop_size: 100
  max_iter: 200
  prob_mut: 0.05
  prob_cx: 0.8
  early_stopping_rounds: 30            # 最优适应度连续30代无改进提前停
  random_state: 42
  # 配比约束（每煤种占比上下限由输入JSON给出，此处为全局兜底）
  constraints:
    min_single_ratio: 0.0
    max_single_ratio: 0.35             # 单一煤种全局上限（防过度依赖单煤种）
    ratio_sum_tolerance: 0.001         # 配比和=1容差
  # 输出3套方案（4.1.1：成本最优/质量最稳/综合推荐）
  solution_modes: ["cost_optimal", "quality_stable", "balanced"]
  balanced_weights:                    # balanced模式的目标权重
    cost: 0.5
    quality: 0.5

# ------------------------------------------------------------
# 设备异常检测 孤立森林（4.3.2：两级预警 level1；RUL后置不承诺）
# ------------------------------------------------------------
isolation_forest:
  n_estimators: 200
  contamination: 0.02                  # 工业现场异常占比先验（需按设备实测校准）
  max_samples: 256
  max_features: 1.0
  random_state: 42
  features:
    - "motor_current"
    - "bearing_temp"
    - "vibration_speed"
    - "oil_temp"
  retrain_frequency: "daily"           # 5.1：每日
  # 两级预警：level1 阈值规则（ISO 10816分级，见settings.yaml alarm段）；
  #           level2 孤立森林异常评分
  anomaly_score_warn: 0.6
  anomaly_score_alarm: 0.75

# ------------------------------------------------------------
# 安全视觉识别 YOLOv8（4.4.1）
# ------------------------------------------------------------
yolov8:
  model_size: "yolov8m"                # 响应要求<3~5秒，n/s太慢精度不足则升m
  image_size: 640
  conf_threshold: 0.5
  iou_threshold: 0.45
  device: "cuda:0"                     # 无GPU推理服务器时改 "cpu"
  tracking: "bytetrack"                # 安全帽/反光衣需跟踪（4.4.1）
  training:
    epochs: 150
    batch_size: 16
    learning_rate: 0.01
    optimizer: "SGD"
    patience: 30
    augment: true
  scenes:                              # 对齐4.4.1识别场景与响应要求
    - { name: "helmet_vest",   response_limit_sec: 3,  classes: ["person", "helmet", "vest"] }
    - { name: "fire_smoke",    response_limit_sec: 5,  classes: ["fire", "smoke"] }
    - { name: "intrusion",     response_limit_sec: 3,  classes: ["person"] }
    - { name: "gauge_reading", response_limit_sec: 5,  classes: ["gauge", "pointer"] }
    - { name: "coke_cake",     response_limit_sec: 30, classes: ["coke_cake"] }

# ------------------------------------------------------------
# 模型版本与注册（MLflow）
# ------------------------------------------------------------
model_registry:
  tracking_uri_env: "MLFLOW_TRACKING_URI"
  experiment_names:
    quality: "coke_quality_prediction"
    furnace: "furnace_temperature_lstm"
    pdm: "equipment_anomaly_detection"
    vision: "safety_vision_yolov8"
