# CI：对齐本地评审门禁 scripts/check.sh（make check / make check-full）
# - backend 任务：pytest + 红线 grep + OpenAPI 契约新鲜度
# - frontend 任务：四个前端模块 npm ci + tsc --noEmit（对应 check.sh --full 第 4 步）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # pyproject.toml requires-python >=3.11
          cache: pip

      - name: 安装后端依赖（pyproject.toml 为唯一声明处）
        run: pip install -e ".[dev]"

      - name: 评审门禁（pytest + 红线 grep + OpenAPI 新鲜度）
        run: bash scripts/check.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/blend_ui/package-lock.json
            frontend/furnace_ui/package-lock.json
            frontend/pdm_ui/package-lock.json
            frontend/dashboard/package-lock.json

      - name: 安装四个前端模块依赖
        run: |
          set -euo pipefail
          for m in blend_ui furnace_ui pdm_ui dashboard; do
            echo "--- ${m} ---"
            # dashboard/.npmrc 已配 legacy-peer-deps（data-view  peerDeps 为 React16）
            (cd "frontend/${m}" && npm ci)
          done

      - name: tsc --noEmit 类型检查
        run: |
          set -euo pipefail
          for m in blend_ui furnace_ui pdm_ui dashboard; do
            echo "--- ${m} ---"
            (cd "frontend/${m}" && npx tsc --noEmit)
          done
